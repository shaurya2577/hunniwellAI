[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunniwell"
version = "0.1.0"
description = "Internal tooling for Hunniwell Lake Ventures: medtech-event scrapers + AI extraction → Airtable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
  # Scrapers (Playwright-based)
  "playwright>=1.40.0",
  # AI extraction → Airtable
  "anthropic>=0.40.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  # Pitchbook converter
  "flask>=3.0.0",
  "pillow>=11.0.0",
  # Knowledge graph (kg/) — Supabase Postgres + pgvector + Voyage embeddings
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "voyageai>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["scrapers*", "ai*", "tools*", "scripts*", "kg*"]
exclude = ["CompanyFiles*", "**/.venv*", "**/recordings*", "**/_browser_profile*"]

[tool.pytest.ini_options]
# Import test modules under their dotted `tests.kg.*` name so the `tests/kg`
# package does not register as bare `kg` in sys.modules and shadow the real
# top-level `kg/` package (needed for `import kg` in tests/kg/test_public_api.py).
consider_namespace_packages = true
